# HU-SEC-001 — TLS 1.2 y TLS 1.3 en el puerto seguro. Certificado local de desarrollo.
server.port=8443
server.http.port=8080

server.ssl.enabled=true
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=${SSL_KEY_STORE_PASSWORD:changeit}
server.ssl.key-alias=practica-u3
server.ssl.protocol=TLS
server.ssl.enabled-protocols=TLSv1.2,TLSv1.3

server.error.include-message=always
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# Secreto HMAC solo para desarrollo. En otros entornos sobreescribir con JWT_SECRET (mínimo 32 bytes).
app.security.jwt.secret=${JWT_SECRET:practica-u3-dev-jwt-secret-key-do-not-use-in-prod}
app.security.jwt.expiration-ms=3600000
app.security.cors.allowed-origins=http://localhost:4200,https://localhost:4200

logging.level.SECURITY_AUDIT=INFO
logging.level.org.apache.tomcat.util.net=INFO
